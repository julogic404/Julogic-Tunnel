name: Compilar dependencias (hev e xray) para Android

# Corre à mão: Actions → "Compilar dependencias (hev e xray) para Android" → Run workflow.
on:
  workflow_dispatch:

# Precisa de escrever no repositório para guardar as .so compiladas.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Obter o repositório
        uses: actions/checkout@v4

      - name: Compilar libhev-socks5-tunnel.so com o NDK do runner
        run: |
          set -euo pipefail
          HEV_VER="2.7.2"
          ABIS="arm64-v8a armeabi-v7a x86_64 x86"

          # O runner do GitHub já traz o NDK instalado.
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-${ANDROID_NDK_LATEST_HOME:-}}}"
          if [ -z "$NDK" ] && [ -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk" ]; then
            NDK="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/* | sort -V | tail -n1)"
          fi
          echo "NDK em uso: $NDK"
          test -x "$NDK/ndk-build"

          # Fonte oficial do hev-socks5-tunnel (com submódulos)
          mkdir -p build/hev
          git clone --recursive --depth 1 --branch "$HEV_VER" \
              https://github.com build/hev/jni

          # O nome do pacote/classe tem de coincidir com hev.htproxy.TProxyService da app.
          cd build/hev
          "$NDK/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            "APP_ABI=$ABIS" \
            APP_PLATFORM=android-21 \
            NDK_LIBS_OUT="$PWD/libs" \
            NDK_OUT="$PWD/obj" \
            "APP_CFLAGS=-O3 -DPKGNAME=hev/htproxy -DCLSNAME=TProxyService" \
            "APP_LDFLAGS=-Wl,--build-id=none -Wl,--hash-style=gnu"
          cd ../..

          for abi in $ABIS; do
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "build/hev/libs/$abi/libhev-socks5-tunnel.so" "app/src/main/jniLibs/$abi/"
          done

      - name: Baixar e incluir o Xray-core oficial
        run: |
          set -euo pipefail
          XRAY_VER="1.8.24"

          # Cria as pastas temporárias e puxa os binários oficiais para cada arquitetura
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            mkdir -p "app/src/main/jniLibs/$abi"
            
            case "$abi" in
              arm64-v8a)   ASSET="Xray-android-arm64-v8a.zip" ;;
              armeabi-v7a) ASSET="Xray-linux-arm32-v7a.zip" ;;
              x86_64)      ASSET="Xray-linux-64.zip" ;;
              x86)         ASSET="Xray-linux-32.zip" ;;
            esac

            echo "Baixando Xray para $abi..."
            curl -fsSL -o "xray-$abi.zip" "https://github.com"
            
            mkdir -p "build/xray-$abi"
            unzip -qo "xray-$abi.zip" -d "build/xray-$abi"
            
            # Renomeia o executável nativo do Xray para funcionar como lib .so na estrutura do Android
            cp "build/xray-$abi/xray" "app/src/main/jniLibs/$abi/libxray.so"
            rm -rf "xray-$abi.zip" "build/xray-$abi"
          done

      - name: Verificar integridade
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            # 1. Verifica o Tun2socks (Hev)
            f1="app/src/main/jniLibs/$abi/libhev-socks5-tunnel.so"
            if [ ! -s "$f1" ]; then echo "FALTA: $f1"; exit 1; fi
            file "$f1"
            strings "$f1" | grep -q "hev/htproxy/TProxyService" \
              && echo "  ✓ JNI hev/htproxy/TProxyService em $abi" \
              || { echo "  ✗ nome JNI errado em $abi"; exit 1; }

            # 2. Verifica o Xray-core
            f2="app/src/main/jniLibs/$abi/libxray.so"
            if [ ! -s "$f2" ]; then echo "FALTA: $f2"; exit 1; fi
            file "$f2"
          done

      - name: Guardar as bibliotecas no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add -f app/src/main/jniLibs/*/*.so
          if git diff --cached --quiet; then
            echo "Sem alterações para guardar."
          else
            git commit -m "Adicionar dependências completas (HEV JNI + Xray)"
            git push
          fi

      - name: Guardar também como ficheiro para descarregar
        uses: actions/upload-artifact@v4
        with:
          name: jni-libs-completas
          path: app/src/main/jniLibs/
          if-no-files-found: error
          retention-days: 14
