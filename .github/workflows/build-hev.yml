name: Compilar dependências completas para Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Obter o repositório
        uses: actions/checkout@v4

      - name: Instalar ferramentas de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip file

      - name: Compilar libhev-socks5-tunnel.so (Nativo JNI)
        run: |
          set -euo pipefail
          HEV_VER="2.7.2"
          NDK="/usr/local/lib/android/sdk/ndk/26.1.10909125"

          mkdir -p build/hev
          git clone --recursive --depth 1 --branch "$HEV_VER" \
              https://github.com build/hev/jni

          cd build/hev
          "$NDK/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            APP_ABI="arm64-v8a armeabi-v7a x86_64 x86" \
            APP_PLATFORM=android-21 \
            NDK_LIBS_OUT="$PWD/libs" \
            NDK_OUT="$PWD/obj" \
            APP_CFLAGS="-O3 -DPKGNAME=hev/htproxy -DCLSNAME=TProxyService" \
            APP_LDFLAGS="-Wl,--build-id=none -Wl,--hash-style=gnu"
          cd ../..

          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "build/hev/libs/$abi/libhev-socks5-tunnel.so" "app/src/main/jniLibs/$abi/"
          done

      - name: Injetar biblioteca oficial do Xray-core
        run: |
          XRAY_VER="1.8.24"
          ABIS=(arm64-v8a armeabi-v7a x86_64 x86)
          
          for abi in "${ABIS[@]}"; do
            case "$abi" in
              arm64-v8a)   XRAY_ASSET="Xray-android-arm64-v8a.zip" ;;
              armeabi-v7a) XRAY_ASSET="Xray-linux-arm32-v7a.zip" ;;
              x86_64)      XRAY_ASSET="Xray-linux-64.zip" ;;
              x86)         XRAY_ASSET="Xray-linux-32.zip" ;;
            esac
            
            curl -fsSL -o "xray-$abi.zip" "https://github.com"
            unzip -qo "xray-$abi.zip" -d "xray_ext_$abi"
            # Move o executável do Xray renomeando-o para .so (truque que a app usa)
            cp "xray_ext_$abi/xray" "app/src/main/jniLibs/$abi/libxray.so"
            rm -rf "xray-$abi.zip" "xray_ext_$abi"
          done

      - name: Verificar Integridade das duas bibliotecas
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            for lib in libhev-socks5-tunnel.so libxray.so; do
              f="app/src/main/jniLibs/$abi/$lib"
              if [ ! -s "$f" ]; then echo "ERRO CRÍTICO EM FALTA: $f"; exit 1; fi
              file "$f"
            done
          done

      - name: Salvar todas as .so no repositório automaticamente
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add -f app/src/main/jniLibs/*/*.so
          if git diff --cached --quiet; then
            echo "Sem alterações."
          else
            git commit -m "Injeta pacotes nativos completos (HEV + Xray)"
            git push
          fi

      - name: Upload do pacote completo pronto
        uses: actions/upload-artifact@v4
        with:
          name: dependencias-completas-julogic
          path: app/src/main/jniLibs/
          retention-days: 7
