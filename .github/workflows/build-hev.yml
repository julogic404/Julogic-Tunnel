name: Build Android Native Libraries

on:
  workflow_dispatch:

  push:
    paths:
      - 'script/**'
      - '.github/workflows/build-hev.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile HEV JNI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: |
          # Garante que todas as licenças do SDK/NDK são aceites antes da instalação
          yes | sdkmanager --licenses || true

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          # Define e exporta as variáveis de ambiente para o ecossistema do executor
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Verify NDK Installation
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          if [ -f "$ANDROID_NDK_HOME/ndk-build" ]; then
            "$ANDROID_NDK_HOME/ndk-build" --version
          else
            echo "ERROR: ndk-build não encontrado em $ANDROID_NDK_HOME"
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl unzip file

      - name: Compile HEV JNI & Setup Dependencies
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          # Atribui permissão de execução aos scripts e roda o centralizador de dependências
          chmod +x script/setup-deps.sh
          chmod +x script/build-hev-jni.sh
          bash script/setup-deps.sh 1.8.24

      - name: Verify generated libraries
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            LIB="app/src/main/jniLibs/$abi/libhev-socks5-tunnel.so"

            if [ ! -s "$LIB" ]; then
              echo "ERROR: Missing $LIB"
              exit 1
            fi

            echo "SUCCESS: $LIB"
            file "$LIB"
          done

      - name: Upload compiled libraries
        uses: actions/upload-artifact@v4
        with:
          name: hev-jni-android
          path: app/src/main/jniLibs/
          if-no-files-found: error
          retention-days: 14
